<style>
body{
  margin:0;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

#productOverlay{
  display:none;
  position:fixed;
  inset:0;
  z-index:10000;
  background:rgba(0,0,0,.68);
  align-items:center;
  justify-content:center;
}

#productCard{
  width:min(820px,90vw);
  max-height:90vh;
  overflow-y:auto;
  box-sizing:border-box;
  background:#F7F2E8;
  color:#26384D;
  padding:25px 32px;
  border-radius:15px;
  border:4px solid #26384D;
}

#productTitle{
  text-align:center;

  font-size:27px;
}

#productSubtitle{
  text-align:center;
  color:#C95F42;
  font-size:20px;
  font-weight:bold;
  letter-spacing:1px;
  margin-bottom:18px;
}

.product-main{
  display:flex;
  gap:28px;
  align-items:center;
}

#productImage{
  width:280px;
  height:210px;
  object-fit:cover;
  border-radius:10px;
  background:white;
}

.product-copy{
  flex:1;
}

#productDescription{
  color:#4E5560;
  line-height:1.55;
  font-size:16px;
  margin:0;
}

#promoSection{
  display:none;
}

.promoFeatures{
  display:flex;
  gap:15px;
  margin-top:20px;
}

.promoFeature{
  flex:1;
  display:flex;
  align-items:center;
  background:white;
  border-radius:10px;
  overflow:hidden;
  min-height:105px;
}

.promoFeature img{
  width:110px;
  height:105px;
  object-fit:cover;
}

.promoFeatureText{
  padding:12px;
}

.promoFeatureText h3{
  margin:0 0 5px;
  color:#26384D;
  font-size:15px;
}

.promoFeatureText p{
  margin:0;
  color:#777;
  font-size:13px;
  line-height:1.35;
}

#promoCTA{
  text-align:center;
  margin-top:18px;
  color:#C95F42;
  font-size:16px;
  font-weight:bold;
  letter-spacing:.5px;
}

.productButtons{
  display:flex;
  justify-content:center;
  gap:15px;
  margin-top:18px;
}

.productButtons button{
  padding:11px 27px;
  border:none;
  border-radius:6px;
  font-size:14px;
  cursor:pointer;
}

#closeButton{
  background:#68727C;
  color:white;
}

#closeButton:hover{
  background:#7D8791;
}

#addButton{
  background:#26384D;
  color:white;
  font-weight:bold;
}

#addButton:hover{
  background:#364D68;
}

#alreadyAdded{
  display:none;
  text-align:center;
  margin-top:17px;
  color:#4E9D62;
  font-weight:bold;
}

#message{
  display:none;
  position:fixed;
  left:50%;
  bottom:35px;

  z-index:9000;
  padding:12px 22px;

  color:white;
  border-radius:7px;

  align-items:center;

<script>

const productData={

  popcorn:{
    title:"LesserEvil Himalayan Pink Salt Popcorn",
    subtitle:"LIGHT, CRUNCHY & SIMPLE",
    image:"image/popcorn2.jpg",
    description:"A light and crunchy popcorn with coconut oil and Himalayan pink salt.",
    promo:true,
    cta:"TRY SOMETHING LIGHT & CRUNCHY"
  },

  jerky:{
    title:"Beef Jerky",
    subtitle:"A savory high-protein snack",
    image:"",
    description:"Beef jerky is made from seasoned cuts of beef that are dried to remove moisture. This process gives the snack its characteristic chewy texture and concentrated savory flavor.",
    promo:false
  },

  graza:{
    title:"GRAZA",
    subtitle:"Olive oil in a distinctive squeeze bottle",
    image:"",
    description:"GRAZA is known for olive oil packaged in a squeeze bottle designed for easy use while cooking. Olive oil can be used for cooking, finishing dishes, dressings, and many other everyday foods.",
    promo:false
  }

};

const productTargets={

  popcorn:{
    xMin:.40,
    xMax:.60,
    yMin:.36,
    yMax:.64
  },

  jerky:{
    xMin:.25,
    xMax:.43,
    yMin:.45,
    yMax:.73
  },

  graza:{
    xMin:.59,
    xMax:.79,
    yMin:.36,
    yMax:.64
  }

};

let currentProduct=null;

AFRAME.registerComponent("shopping-game",{

  init:function(){

    window.shoppingGame=this;

    this.found={
      popcorn:false,
      jerky:false,
      graza:false
    };

    this.raycaster=new THREE.Raycaster();
    this.mouse=new THREE.Vector2();
    this.messageTimer=null;

    window.addEventListener("mousedown",event=>{

      if(event.button!==0)return;

      const productOverlay=
        document.querySelector("#productOverlay");

      const completeOverlay=
        document.querySelector("#completeOverlay");

      if(
        productOverlay.style.display==="flex" ||
        completeOverlay.style.display==="flex"
      ){
        return;
      }

      const camera=
        document.querySelector("#main-camera");

      const model=
        document.querySelector("#snack-model");

      if(
        !camera ||
        !camera.components.camera ||
        !model
      ){
        return;
      }

      this.mouse.x=
        (event.clientX/window.innerWidth)*2-1;

      this.mouse.y=
        -(event.clientY/window.innerHeight)*2+1;

      this.raycaster.setFromCamera(
        this.mouse,
        camera.components.camera.camera
      );

      const hits=
        this.raycaster.intersectObject(
          model.object3D,
          true
        );

      if(hits.length===0){

        this.showMessage(
          "Click directly on a product."
        );

        return;
      }

      const product=
        this.findProduct(
          hits[0].point.clone()
        );

      if(product){

        openProduct(product);

      }else{

        this.showMessage(
          "This item is not on your shopping list."
        );

      }

    });

  },

  findProduct:function(worldPoint){

    const model=
      document.querySelector("#snack-model");

    if(!model)return null;

    const box=
      new THREE.Box3().setFromObject(
        model.object3D
      );

    const size=
      new THREE.Vector3();

    box.getSize(size);

    if(
      size.x<=0 ||
      size.y<=0
    ){
      return null;
    }

    const normalizedX=
      (worldPoint.x-box.min.x)/size.x;

    const normalizedY=
      (worldPoint.y-box.min.y)/size.y;

    for(
      const product in productTargets
    ){

      const area=
        productTargets[product];

      if(
        normalizedX>=area.xMin &&
        normalizedX<=area.xMax &&
        normalizedY>=area.yMin &&
        normalizedY<=area.yMax
      ){
        return product;
      }

    }

    return null;

  },

  addItem:function(product){

    if(
      !product ||
      this.found[product]
    ){
      return;
    }

    this.found[product]=true;

    const check=
      document.querySelector(
        "#"+product+"-check"
      );

    const label=
      document.querySelector(
        "#"+product+"-label"
      );

    if(check){

      check.setAttribute(
        "value",
        "✓"
      );

      check.setAttribute(
        "color",
        "#4E9D62"
      );

    }

    if(label){

      label.setAttribute(
        "color",
        "#4E9D62"
      );

    }

    this.showMessage(
      productData[product].title+
      " added to cart!"
    );

    this.updateProgress();

  },

  updateProgress:function(){

    let count=0;

    if(this.found.popcorn)count++;
    if(this.found.jerky)count++;
    if(this.found.graza)count++;

    document
      .querySelector("#progress-text")
      .setAttribute(
        "value",
        count+" / 3 ITEMS FOUND"
      );

    if(count===3){

      document
        .querySelector("#status-text")
        .setAttribute(
          "value",
          "SHOPPING COMPLETE!"
        );

      document
        .querySelector("#status-text")
        .setAttribute(
          "color",
          "#4E9D62"
        );

      document
        .querySelector("#next-level")
        .setAttribute(
          "visible",
          true
        );

      setTimeout(()=>{

        document
          .querySelector("#completeOverlay")
          .style.display="flex";

      },600);

    }

  },

  showMessage:function(text){

    const message=
      document.querySelector("#message");

    message.textContent=text;
    message.style.display="block";

    clearTimeout(
      this.messageTimer
    );

    this.messageTimer=
      setTimeout(()=>{

        message.style.display="none";

      },1800);

  }

});

function openProduct(product){

  const data=
    productData[product];

  if(!data)return;

  currentProduct=product;

  document
    .querySelector("#productTitle")
    .textContent=data.title;

  document
    .querySelector("#productSubtitle")
    .textContent=data.subtitle;

  document
    .querySelector("#productDescription")
    .textContent=data.description;

  const image=
    document.querySelector("#productImage");

  if(data.image){

    image.src=data.image;
    image.style.display="block";

  }else{

    image.style.display="none";

  }

  const promoSection=
    document.querySelector("#promoSection");

  if(data.promo){

    promoSection.style.display="block";

    document
      .querySelector("#promoCTA")
      .textContent=data.cta;

  }else{

    promoSection.style.display="none";

  }

  const alreadyFound=
    window.shoppingGame.found[product];

  document
    .querySelector("#addButton")
    .style.display=
      alreadyFound
      ? "none"
      : "block";

  document
    .querySelector("#alreadyAdded")
    .style.display=
      alreadyFound
      ? "block"
      : "none";

  document
    .querySelector("#productOverlay")
    .style.display="flex";

}

function closeProduct(){

  document
    .querySelector("#productOverlay")
    .style.display="none";

  currentProduct=null;

}

function addCurrentProduct(){

  if(!currentProduct)return;

  const sound=
    document.querySelector(
      "#cartSound"
    );

  if(sound){

    sound.currentTime=0;

    sound.play().catch(()=>{
      console.log(
        "Audio could not play."
      );
    });

  }

  window.shoppingGame.addItem(
    currentProduct
  );

  closeProduct();

}

function closeCompletePanel(){

  document
    .querySelector("#completeOverlay")
    .style.display="none";

}

AFRAME.registerComponent(
  "simple-collision",
  {

  init:function(){

    this.lastPosition=
      new THREE.Vector3();

    const camera=
      this.el.querySelector(
        "[camera]"
      );

    if(camera){

      this.lastPosition.copy(
        camera.object3D.position
      );

    }

  },

  tick:function(){

    const camera=
      this.el.querySelector(
        "[camera]"
      );

    if(!camera)return;

    const cameraPosition=
      camera.object3D.position;

    const worldPosition=
      new THREE.Vector3();

    camera.object3D.getWorldPosition(
      worldPosition
    );

    let collided=false;

    document
      .querySelectorAll(
        ".collision-box"
      )
      .forEach(wall=>{

        const box=
          new THREE.Box3()
          .setFromObject(
            wall.object3D
          );

        if(
          worldPosition.x>box.min.x &&
          worldPosition.x<box.max.x &&
          worldPosition.z>box.min.z &&
          worldPosition.z<box.max.z
        ){
          collided=true;
        }

      });

    if(collided){

      cameraPosition.copy(
        this.lastPosition
      );

    }else{

      this.lastPosition.copy(
        cameraPosition
      );

    }

  }

});

</script>

    <a-box position=".73 2.15 0"

  <!-- SHOPPING SCREEN -->

  <a-entity

    <a-plane
      position="0 0 .056"

    <a-text
      value="SHOPPING&#10;CHALLENGE"
      position="0 .75 .065"
      align="center"
      color="#26384D"
      width="2.1">
    </a-text>

    <a-text
      value="Find these 3 items"
      position="0 .40 .065"
      align="center"
      color="#666666"
      width="1.7">
    </a-text>

    <a-text
      id="popcorn-check"
      value="O"
      position="-.58 .12 .065"
      color="#999"
      width="1.5">
    </a-text>

    <a-text
      id="popcorn-label"
      value="Pink Salt Popcorn"
      position="-.38 .12 .065"
      color="#333"

      color="#333"
      width="1.55">
    </a-text>

    <a-text
      id="progress-text"
      value="0 / 3 ITEMS FOUND"
      position="0 -.68 .065"
      align="center"
      color="#26384D"
      width="1.8">
    </a-text>

    <a-text
      id="status-text"
      value="START SHOPPING"
      position="0 -.87 .065"
      align="center"
      color="#888"
      width="1.5">

    <a-entity
      id="next-level"
      visible="false">

      <a-plane
        position="0 -1.05 .07"

        height=".22"

      </a-plane>

      <a-text
        value="NEXT LEVEL >"
        position="0 -1.05 .08"
        align="center"
        color="white"
        width="1.45">

  <a-box

  <a-entity
